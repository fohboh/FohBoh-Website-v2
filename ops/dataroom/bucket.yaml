# FohBoh Data Room — private document storage and access log (AWS CloudFormation).
# Deploy once: aws cloudformation deploy --template-file ops/dataroom/bucket.yaml --stack-name fohboh-dataroom --capabilities CAPABILITY_NAMED_IAM
# Then create one access key for the DataRoomApp user in the IAM console and put it in Vercel (see ops/dataroom/README.md).
AWSTemplateFormatVersion: "2010-09-09"
Description: FohBoh Data Room private bucket and least-privilege app user
Parameters:
  BucketName:
    Type: String
    Default: fohboh-dataroom-private
Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      OwnershipControls: { Rules: [ { ObjectOwnership: BucketOwnerEnforced } ] }
      BucketEncryption: { ServerSideEncryptionConfiguration: [ { ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } } ] }
      VersioningConfiguration: { Status: Enabled }
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: ["https://www.fohboh.ai", "https://fohboh.ai", "https://*.vercel.app"]
            AllowedHeaders: ["content-type"]
            MaxAge: 600
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Statement:
          - Sid: TLSOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt Bucket.Arn, !Sub "${Bucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }
  AppUser:
    Type: AWS::IAM::User
    Properties:
      UserName: DataRoomApp
      Policies:
        - PolicyName: dataroom-bucket-only
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${Bucket.Arn}/*"
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt Bucket.Arn
Outputs:
  Bucket: { Value: !Ref Bucket }
  Region: { Value: !Ref AWS::Region }
  AppUser: { Value: !Ref AppUser }
